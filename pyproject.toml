[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doom-team"
version = "0.1.0"
description = "Doom Team - self-hosted autonomous software-engineering platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "Doom Autopilot" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==1.10.0",
    "pip-tools==7.4.1",
    "pre-commit==3.7.1",
    "pytest==8.2.2",
    "ruff==0.4.9",
]

[project.scripts]
doom-team = "doom_team.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doom_team = ["py.typed"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
