name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Lint
        run: make lint
      - name: Type
        run: make type
      - name: Test
        run: make test

  clean-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create fresh venv
        run: python -m venv .venv
      - name: Install from lock
        run: .venv/bin/pip install -e ".[dev]" -c constraints.txt
      - name: Quality gate
        run: |
          . .venv/bin/activate
          make quality
