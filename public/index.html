<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doom Core</title>
<style>
:root{--bg:#080b12;--p:#111722;--p2:#161e2b;--b:#293448;--t:#e8edf6;--m:#8d9aaf;--a:#7c6cff;--g:#45d17d;--w:#ffb74d;--r:#ff6b7d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Segoe UI,Arial,sans-serif}
.wrap{max-width:1450px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:16px}
.topRight{display:flex;gap:10px;align-items:center}h1{margin:0;font-size:24px}small,.muted{color:var(--m)}.badge{border:1px solid var(--b);padding:7px 10px;border-radius:999px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:var(--p);border:1px solid var(--b);color:var(--t);padding:8px 12px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--a);border-color:var(--a)}.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:13px}.item h3{margin:0 0 5px}.meta{font-size:12px;color:var(--m)}
button{background:var(--p2);border:1px solid var(--b);color:var(--t);padding:8px 11px;border-radius:9px;cursor:pointer}.primary{background:var(--a);border-color:var(--a)}
.danger{color:#ff9eac}.good{color:var(--g)}.warn{color:var(--w)}
input,textarea,select{width:100%;background:#0b1018;border:1px solid var(--b);color:var(--t);border-radius:9px;padding:9px}
.topRight select{width:auto;min-width:110px}textarea{min-height:100px}.field{margin-bottom:10px}.field label{display:block;color:var(--m);font-size:12px;margin-bottom:5px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}pre{background:#080c13;padding:10px;border-radius:9px;overflow:auto;white-space:pre-wrap}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--b);text-align:left}th{color:var(--m);font-size:12px}
.progress{height:10px;background:#080c13;border:1px solid var(--b);border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--a);transition:width .25s}
.liveDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);margin-right:6px;box-shadow:0 0 8px var(--g)}
.taskRunning{outline:1px solid #7c6cff55;background:#171b2c}.activity{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:#aeb8ca}
.monitorBar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:9px 11px;background:#0b1018;border:1px solid var(--b);border-radius:10px;margin:10px 0}
@media(max-width:950px){.grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>DOOM CORE <span class="muted" id="version"></span></h1><small id="subtitle"></small></div>
    <div class="topRight"><select id="quickLang"></select><div class="badge" id="health"></div></div>
  </div>
  <div class="tabs">
    <button data-tab="missions"></button>
    <button data-tab="approvals"></button>
    <button data-tab="messages"></button>
    <button data-tab="factory"></button>
    <button data-tab="agents"></button>
    <button data-tab="skills"></button>
    <button data-tab="teams"></button>
    <button data-tab="templates"></button>
    <button data-tab="providers"></button>
    <button data-tab="models"></button>
    <button data-tab="router"></button>
    <button data-tab="runtimes"></button>
    <button data-tab="tools"></button>
    <button data-tab="compat"></button>
    <button data-tab="executions"></button>
    <button data-tab="diagnostics"></button>
    <button data-tab="settings"></button>
  </div>
  <div id="view"></div>
</div>
<script>
const $=s=>document.querySelector(s);
let data={},tab='agents',messages={},locale='tr',settings={},locales=[];
let missionAutoRefresh=localStorage.getItem('doom-mission-auto-refresh')!=='false';
let missionRefreshTimer=null;
let missionRefreshBusy=false;
let missionLastUpdated=null;
let diagnosticCatalog=[];
let diagnosticLastRun=null;

async function j(url,opt){
  const r=await fetch(url,opt);
  const raw=await r.text();
  let body;
  try{body=JSON.parse(raw)}catch{body=raw}
  if(!r.ok){
    const msg=typeof body==='string'?body:(body.details||body.code||JSON.stringify(body));
    throw new Error(msg);
  }
  return body;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function t(k,fallback){return messages[k]??fallback??k}
function status(s){return t('status.'+String(s||'unknown'),s)}
function entityName(x){return x.display_name||x.name||''}
function entityDesc(x){return x.display_description||x.description||''}

async function boot(){
  locales=(await j('/api/i18n/locales')).items;
  settings=await j('/api/settings');
  locale=localStorage.getItem('doom-ui-locale')||settings.uiLocale||'tr';
  if(!locales.some(x=>x.code===locale)) locale=settings.uiLocale||'tr';
  await loadMessages();
  await loadData();
}

async function persistUiLocale(code){
  settings=await j('/api/settings',{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uiLocale:code})
  });
}

async function loadMessages(){
  messages=await j('/api/i18n/'+encodeURIComponent(locale));
  document.documentElement.lang=locale;
  document.title=t('app.title','DOOM CORE');
  $('#subtitle').textContent=t('app.subtitle');
  $('#health').textContent=t('common.loading');

  const q=$('#quickLang');
  q.innerHTML=locales.map(x=>`<option value="${esc(x.code)}">${esc(x.nativeLabel)}</option>`).join('');
  q.value=locale;
  q.onchange=async()=>{
    locale=q.value;
    localStorage.setItem('doom-ui-locale',locale);
    await persistUiLocale(locale);
    await loadMessages();
    await loadData();
  };

  const tabs={
    missions:'nav.missions',approvals:'nav.approvals',messages:'nav.messages',factory:'nav.factory',agents:'nav.agents',skills:'nav.skills',teams:'nav.teams',templates:'nav.templates',providers:'nav.providers',models:'nav.models',router:'nav.router',
    runtimes:'nav.runtimes',tools:'nav.tools',compat:'nav.compatibility',executions:'nav.executions',diagnostics:'nav.diagnostics',settings:'nav.settings'
  };
  document.querySelectorAll('.tabs button').forEach(b=>b.textContent=t(tabs[b.dataset.tab]));
}

async function loadData(){
  const lang='?lang='+encodeURIComponent(locale);
  const [h,mi,ap,msg,fr,a,sk,tm,tp,p,m,mp,r,tl,c,e]=await Promise.all([
    j('/health'),j('/api/missions'),j('/api/approvals?status=all'),j('/api/messages?limit=150'),j('/api/agent-factory/requests?limit=200'),j('/api/agents'+lang),j('/api/skills'),j('/api/teams'+lang),j('/api/registry/templates'+lang),
    j('/api/registry/providers'),j('/api/registry/models'),j('/api/model-policies'),j('/api/registry/runtimes'+lang),j('/api/tools'),
    j('/api/registry/compatibility'+lang),j('/api/executions'+lang)
  ]);
  settings=await j('/api/settings');
  data={h,mi:mi.items,ap:ap.items,msg:msg.items,fr:fr.items,a:a.items,sk:sk.items,tm:tm.items,tp:tp.items,p:p.items,m:m.items,mp:mp.items,r:r.items,tl:tl.items,c:c.items,e:e.items};
  $('#version').textContent='V'+h.version;
  $('#health').innerHTML=`<span class="good">● ${esc(t('common.online'))}</span> · ${esc(h.version)}`;
  render();
}

function nav(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
}
function render(){
  nav();
  const v=$('#view');
  const views={missions:missionsView,approvals:approvalsView,messages:messagesView,factory:factoryView,agents,skills:skillsView,teams,templates,providers:providersView,models,router:routerView,runtimes,tools:toolsView,compat,executions,diagnostics:diagnosticsView,settings:settingsView};
  (views[tab]||agents)(v);
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  render();
  syncMissionAutoRefresh();
});

let openMissionId=null;

function missionPercent(m){
  const tasks=m.tasks||[];
  if(!tasks.length)return 0;
  const done=tasks.filter(x=>x.status==='done').length;
  return Math.round((done/tasks.length)*100);
}

function missionEventLabel(type){
  return t('events.'+type,type);
}

function formatClock(value){
  if(!value)return '—';
  try{return new Date(value).toLocaleTimeString()}catch{return String(value)}
}

function toggleMissionAutoRefresh(){
  missionAutoRefresh=!missionAutoRefresh;
  localStorage.setItem('doom-mission-auto-refresh',missionAutoRefresh?'true':'false');
  syncMissionAutoRefresh();
  if(openMissionId)openMission(openMissionId,true);
}

function syncMissionAutoRefresh(){
  if(missionRefreshTimer){
    clearInterval(missionRefreshTimer);
    missionRefreshTimer=null;
  }
  if(tab==='missions' && openMissionId && missionAutoRefresh){
    missionRefreshTimer=setInterval(()=>refreshOpenMissionSilently(),2000);
  }
}

async function refreshOpenMissionSilently(){
  if(!openMissionId || tab!=='missions' || !missionAutoRefresh || document.hidden || missionRefreshBusy)return;
  missionRefreshBusy=true;
  try{
    await openMission(openMissionId,true);
  }catch{}
  finally{missionRefreshBusy=false}
}

document.addEventListener('visibilitychange',()=>syncMissionAutoRefresh());


function missionProgress(m){
  const total=Number(m.task_count||0);
  const done=Number(m.done_count||0);
  return total?`${done}/${total}`:'0/0';
}

function missionsView(v){
  v.innerHTML=`<div class="grid2">
    <div>
      <div class="card"><h3>${esc(t('missions.title'))}</h3><p class="muted">${esc(t('missions.explanation'))}</p></div>
      <div class="grid" style="margin-top:10px">${(data.mi||[]).map(m=>`
        <div class="item">
          <h3>${esc(m.title)}</h3>
          <div class="meta">${esc(m.team_name)} · ${esc(t('missions.lead'))}: ${esc(m.lead_agent_name)}</div>
          <div class="meta">${esc(t('executions.status'))}: ${esc(status(m.status))} · ${esc(t('missions.progress'))}: ${esc(missionProgress(m))}</div>
          ${m.error_text?`<div class="meta warn">${esc(m.error_text)}</div>`:''}
          <div class="actions">
            ${!['new','done','cancelled','awaiting_approval'].includes(m.status)?`<button onclick="replanMissionUi('${m.id}')">${esc(t('missions.replan'))}</button>`:''}
            ${m.status==='running'?`<button onclick="pauseMissionUi('${m.id}')">${esc(t('missions.pause'))}</button>`:''}
            ${!['done','cancelled'].includes(m.status)?`<button onclick="cancelMissionUi('${m.id}')">${esc(t('missions.cancel'))}</button><button class="danger" onclick="killMissionUi('${m.id}')">${esc(t('missions.kill'))}</button>`:''}
            <button onclick="openMission('${m.id}')">${esc(t('missions.details'))}</button>
          </div>
        </div>`).join('')||`<div class="muted">${esc(t('missions.none'))}</div>`}</div>
    </div>
    <div class="card">
      <h3>${esc(t('missions.new'))}</h3>
      <div class="field"><label>${esc(t('missions.name'))}</label><input id="missionTitle"></div>
      <div class="field"><label>${esc(t('missions.objective'))}</label><textarea id="missionObjective" style="min-height:180px"></textarea></div>
      <div class="field"><label>${esc(t('missions.team'))}</label>
        <select id="missionTeam">${(data.tm||[]).map(x=>`<option value="${x.id}">${esc(entityName(x))}</option>`).join('')}</select>
      </div>
      <div class="actions">
        <button onclick="missionPreflightUi(true)">${esc(t('missions.preflight'))}</button>
        <button class="primary" onclick="createMissionUi()">${esc(t('missions.createAndRun'))}</button>
      </div>
    </div>
  </div>
  <div id="missionDetail" style="margin-top:14px"></div>`;

  if(openMissionId)openMission(openMissionId,true);
  syncMissionAutoRefresh();
}

function currentMissionDraft(){
  return {
    title:$('#missionTitle')?.value||'',
    objective:$('#missionObjective')?.value||'',
    teamId:$('#missionTeam')?.value||''
  };
}

async function missionPreflightUi(showAlert=true){
  const body=currentMissionDraft();
  const result=await j('/api/diagnostics/mission-preflight',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
  });
  if(showAlert){
    alert((result.ok?t('diagnostics.preflightOk'):t('diagnostics.preflightFailed'))+'\n\n'+
      result.checks.map(x=>`${x.status.toUpperCase()} · ${x.id} · ${x.summary}`).join('\n'));
  }
  return result;
}

async function createMissionUi(){
  const body=currentMissionDraft();
  const preflight=await missionPreflightUi(false);
  if(!preflight.ok){
    alert(t('diagnostics.preflightFailed')+'\n\n'+
      preflight.checks.filter(x=>x.status==='fail').map(x=>`${x.id}: ${x.summary}`).join('\n'));
    return;
  }
  try{
    const x=await j('/api/missions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    alert(t('missions.created'));
    openMissionId=x.id;
    await loadData();
    syncMissionAutoRefresh();
  }catch(e){
    alert(t('missions.createFailed')+': '+(e.message||e));
  }
}

async function planMissionUi(id){
  await j('/api/missions/'+id+'/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  alert(t('missions.planningStarted'));
  openMissionId=id;
  await loadData();
}


async function replanMissionUi(id){
  if(!confirm(t('missions.replanConfirm')))return;
  try{
    await j('/api/missions/'+id+'/replan',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:'{}'
    });
    alert(t('missions.replanStarted'));
  }catch(e){
    alert(t('missions.replanFailed')+': '+(e.message||e));
    return;
  }
  openMissionId=id;
  await loadData();
  syncMissionAutoRefresh();
}

async function runMissionUi(id){
  try{
    await j('/api/missions/'+id+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    alert(t('missions.runStarted'));
  }catch(e){alert(e.message)}
  openMissionId=id;
  await loadData();
}

async function pauseMissionUi(id){
  await j('/api/missions/'+id+'/pause',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  openMissionId=id;
  await loadData();
}


async function cancelMissionUi(id){
  if(!confirm(t('missions.cancelConfirm')))return;
  await j('/api/missions/'+id+'/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  openMissionId=id;
  await loadData();
}
async function killMissionUi(id){
  if(!confirm(t('missions.killConfirm')))return;
  await j('/api/missions/'+id+'/kill',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  openMissionId=id;
  await loadData();
}
async function cancelMissionTaskUi(missionId,taskId,mode){
  const key=mode==='kill'?'missions.killConfirm':'executions.cancelConfirm';
  if(!confirm(t(key)))return;
  await j('/api/missions/'+missionId+'/tasks/'+taskId+'/'+mode,{
    method:'POST',headers:{'Content-Type':'application/json'},body:'{}'
  });
  openMissionId=missionId;
  await loadData();
}

async function retryMissionTaskUi(missionId,taskId){
  await j('/api/missions/'+missionId+'/tasks/'+taskId+'/retry',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  alert(t('missions.retryStarted'));
  openMissionId=missionId;
  await loadData();
}


async function reassignMissionTaskUi(missionId,taskId,selectId){
  const agentId=$('#'+selectId).value;
  await j('/api/missions/'+missionId+'/tasks/'+taskId+'/reassign',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({agentId})
  });
  alert(t('missions.reassigned'));
  openMissionId=missionId;
  await loadData();
}


async function sendMissionMessageUi(missionId){
  const target=$('#missionMessageTarget');
  const content=$('#missionMessageContent').value.trim();
  if(!content)return;
  const option=target.selectedOptions[0];
  const recipientType=option.dataset.type;
  const recipientId=option.value;
  await j('/api/missions/'+missionId+'/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      recipientType,
      recipientId,
      content,
      messageType:'directive',
      priority:$('#missionMessagePriority').value
    })
  });
  $('#missionMessageContent').value='';
  await openMission(missionId,true);
}

async function openMission(id,silent=false){
  openMissionId=id;
  const host=$('#missionDetail');
  if(!host)return;
  if(!silent){
    host.innerHTML=`<div class="card"><span class="muted">${esc(t('common.loading'))}</span></div>`;
  }

  try{
    const m=await j('/api/missions/'+id);
    missionLastUpdated=new Date().toISOString();
    const taskName=new Map((m.tasks||[]).map(x=>[x.id,x.task_key]));
    const pct=missionPercent(m);
    const running=(m.tasks||[]).find(x=>['running','validating'].includes(x.status));
    const activeGate=[...(m.gates||[])].reverse().find(g=>g.status==='running');
    const activity=running?.liveExecution
      ? `${running.task_key} · ${missionEventLabel(running.liveExecution.eventType)}`
      : activeGate
        ? `${t('gate.'+activeGate.gate_type,activeGate.gate_type)} · ${status(activeGate.status)}`
        : t('missions.liveWaiting');

    const gateLatest=(type)=>[...(m.gates||[])].reverse().find(g=>g.gate_type===type);
    const qaGate=gateLatest('qa');
    const reviewerGate=gateLatest('reviewer');
    const acceptance=m.gates?.filter(g=>g.gate_type==='acceptance')||[];

    host.innerHTML=`<div class="card">
      <div class="actions" style="float:right">
        ${!['new','done','cancelled','awaiting_approval'].includes(m.status)?`<button onclick="replanMissionUi('${m.id}')">${esc(t('missions.replan'))}</button>`:''}
        <button onclick="openMissionId=null;syncMissionAutoRefresh();$('#missionDetail').innerHTML=''">${esc(t('missions.close'))}</button>
        <button onclick="openMission('${m.id}')">${esc(t('missions.refresh'))}</button>
      </div>
      <h3>${esc(m.title)}</h3>
      <p>${esc(m.objective)}</p>

      <div class="monitorBar">
        <span><span class="liveDot"></span><strong>${esc(t('missions.live'))}</strong></span>
        <label><input type="checkbox" style="width:auto" ${missionAutoRefresh?'checked':''} onchange="toggleMissionAutoRefresh()"> ${esc(t('missions.autoRefresh'))}</label>
        <span class="muted">${esc(t('missions.refreshEvery'))}</span>
        <span class="muted">${esc(t('missions.lastUpdated'))}: ${esc(formatClock(missionLastUpdated))}</span>
        <span class="activity">${esc(t('missions.currentActivity'))}: ${esc(activity)}</span>
      </div>

      <div class="item" style="margin:10px 0">
        <h4>${esc(t('missions.communication'))} / ${esc(t('messages.steering'))}</h4>
        <div class="meta">${esc(t('messages.steeringHint'))}</div>
        <div class="grid2" style="margin-top:8px">
          <div class="field"><label>${esc(t('messages.target'))}</label>
            <select id="missionMessageTarget">
              <option data-type="mission" value="${m.id}">${esc(t('messages.mission'))}: ${esc(m.title)}</option>
              ${(m.tasks||[]).map(task=>`<option data-type="task" value="${task.id}">${esc(t('messages.task'))}: ${esc(task.task_key)} · ${esc(task.title)}</option>`).join('')}
              ${(m.tasks||[]).filter(task=>task.execution_id && ['running','validating'].includes(task.status)).map(task=>`<option data-type="execution" value="${task.execution_id}">${esc(t('messages.execution'))}: ${esc(task.task_key)}</option>`).join('')}
              ${(m.teamMembers||[]).map(a=>`<option data-type="agent" value="${a.id}">${esc(t('messages.agent'))}: ${esc(a.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>${esc(t('messages.priority'))}</label>
            <select id="missionMessagePriority"><option value="normal">${esc(t('messages.normal'))}</option><option value="high">${esc(t('messages.high'))}</option><option value="low">${esc(t('messages.low'))}</option></select>
          </div>
        </div>
        <div class="field"><textarea id="missionMessageContent" placeholder="${esc(t('messages.content'))}"></textarea></div>
        <button onclick="sendMissionMessageUi('${m.id}')">${esc(t('messages.send'))}</button>
        <div style="max-height:190px;overflow:auto;margin-top:10px">
          ${(m.messages||[]).slice().reverse().slice(0,20).map(msg=>`<div class="meta"><code>${esc(msg.created_at)}</code> · <strong>${esc(msg.sender_agent_name||msg.sender_type)}</strong> → ${esc(msg.recipient_type)} · ${esc(t('messages.'+msg.message_type,msg.message_type))}<br>${esc(msg.content)}</div>`).join('')||`<div class="muted">${esc(t('messages.none'))}</div>`}
        </div>
      </div>

      <div class="meta">${esc(t('missions.team'))}: ${esc(m.team_name)} · ${esc(t('missions.lead'))}: ${esc(m.lead_agent_name)} · ${esc(t('executions.status'))}: <strong>${esc(status(m.status))}</strong></div>
      <div style="margin:8px 0"><div class="progress"><span style="width:${pct}%"></span></div><div class="meta">${pct}% · ${(m.tasks||[]).filter(x=>x.status==='done').length}/${(m.tasks||[]).length}</div></div>
      ${m.error_text?`<pre class="warn">${esc(m.error_text)}</pre>`:''}
      ${m.status==='awaiting_approval'?`<div class="item warn" style="margin:10px 0">${esc(t('missions.awaitingBoss'))} <button onclick="tab='approvals';render();syncMissionAutoRefresh()">${esc(t('nav.approvals'))}</button></div>`:''}

      ${(m.specialists||[]).length?`<div class="item" style="margin:10px 0"><h4>${esc(t('factory.active'))}</h4>
        ${(m.specialists||[]).map(s=>`<span class="badge">${esc(s.name)} · ${esc(s.role_name)} · ${esc(status(s.status))}</span>`).join(' ')}
        <div class="actions"><button onclick="factoryMissionId='${m.id}';tab='factory';render();syncMissionAutoRefresh()">${esc(t('nav.factory'))}</button></div>
      </div>`:''}

      <div class="grid2" style="margin:12px 0">
        <div class="item">
          <h4>${esc(t('missions.workspace'))}</h4>
          <div class="meta">${esc(t('missions.workspaceMode'))}: ${esc(t('workspace.'+(m.workspace?.mode||'shared'),m.workspace?.mode||'shared'))}</div>

function messageRecipientLabel(m){
  if(m.recipient_type==='mission'){
    const mission=data.mi?.find(x=>x.id===m.recipient_id);
    return `${t('messages.mission')}: ${mission?.title||m.recipient_id}`;
  }
  if(m.recipient_type==='task')return `${t('messages.task')}: ${m.recipient_id}`;
  if(m.recipient_type==='execution')return `${t('messages.execution')}: ${m.recipient_id}`;
  if(m.recipient_type==='agent'){
    const a=data.a?.find(x=>x.id===m.recipient_id);
    return `${t('messages.agent')}: ${a?.display_name||a?.name||m.recipient_id}`;
  }
  return `${m.recipient_type}: ${m.recipient_id}`;
}

function splitTokens(value){
  return String(value||'')
    .split(/[\n,]+/)
    .map(x=>x.trim())
    .filter(Boolean);
}

function effectiveToolNames(grants){
  const set=new Set();
  const catalog=data.tl||[];
  for(const grant of grants||[]){
    const exact=catalog.find(x=>x.name===grant);
    if(exact){set.add(exact.name);continue}
    for(const tool of catalog){
      if(tool.category===grant)set.add(tool.name);
    }
  }
  return set;
}

function inferSkillName(skillMd,fallback){
  const m=String(skillMd||'').match(/^#\s+(.+)$/m); return (m&&m[1].trim())||fallback||'Imported Skill';
}

async function importSkillFolder(){
  const input=$('#skillFolder'); const selected=[...(input.files||[])]; if(!selected.length)return;
  const files={}; let total=0; let manifest={}; const rootName=(selected[0].webkitRelativePath||selected[0].name).split('/')[0];
  for(const f of selected){
    const rel=(f.webkitRelativePath||f.name).split('/').slice(1).join('/')||f.name;
    if(f.size>262144)continue; total+=f.size; if(total>1048576)throw new Error('Skill folder exceeds 1 MB text limit');
    const text=await f.text(); if(text.includes('\u0000'))continue; files[rel]=text;
    if(rel.toLowerCase()==='skill.json'){try{manifest=JSON.parse(text)}catch{}}
  }
  const skillMd=files['SKILL.md']||files['skill.md']||'';
  const skill={...(manifest.skill||manifest),name:(manifest.skill||manifest).name||inferSkillName(skillMd,rootName),slug:(manifest.skill||manifest).slug||rootName,description:(manifest.skill||manifest).description||'',version:(manifest.skill||manifest).version||'1.0.0',instructions:(manifest.skill||manifest).instructions||skillMd,source:'browser-folder'};
  await j('/api/skills/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({format:'doom-skill/v1',skill,files})}); alert(t('skills.imported')); await loadData();
}

async function importSkillJson(){

}

async function saveModel(){

  alert(t('models.saved'));
  await loadData();
}

function policyDefinitionFrom(prefix){
  const caps=[...document.querySelectorAll('.'+prefix+'Req:checked')].map(x=>x.value);
  const require={};
  for(const c of caps)require[c]=true;
  return {
    location:$('#'+prefix+'Location').value,
    require,
    preferredLabels:splitTokens($('#'+prefix+'Labels').value),
    preferredCapabilities:splitTokens($('#'+prefix+'Caps').value),
    preferLowerLatency:$('#'+prefix+'Latency').checked,
    preferLargerContext:$('#'+prefix+'Context').checked,
    fallbackModelIds:[...document.querySelectorAll('.'+prefix+'Fallback:checked')].map(x=>x.value)
  };
}

    ${result.ok?diagnosticStatusBadge('pass'):diagnosticStatusBadge('fail')}
    <div class="meta">${esc(JSON.stringify(result.resolved))}</div>
    ${result.checks.map(x=>`<div class="meta">${diagnosticStatusBadge(x.status)} · <code>${esc(x.id)}</code> · ${esc(x.summary)}</div>`).join('')}
    <details><summary>${esc(t('diagnostics.details'))}</summary><pre>${esc(JSON.stringify(result,null,2))}</pre></details>
  </div>`;
}

async function copyDiagnosticsReport(){
  if(!diagnosticLastRun)return;
  const text=JSON.stringify(diagnosticLastRun,null,2);
  await navigator.clipboard.writeText(text);
  alert(t('diagnostics.reportCopied'));
}

function settingsView(v){
  v.innerHTML=`<div class="card" style="max-width:720px">
    <h3>${esc(t('settings.title'))}</h3>
    <p class="muted">${esc(t('settings.explanation'))}</p>
    <div class="field"><label>${esc(t('settings.uiLanguage'))}</label>
      <select id="sUi">${locales.map(x=>`<option value="${esc(x.code)}">${esc(x.nativeLabel)}</option>`).join('')}</select>
    </div>
    <div class="field"><label>${esc(t('settings.agentLanguage'))}</label>
      <select id="sAgent">${locales.map(x=>`<option value="${esc(x.code)}">${esc(x.nativeLabel)}</option>`).join('')}</select>
    </div>
    <button class="primary" onclick="saveSettings()">${esc(t('settings.save'))}</button>
  </div>`;
  $('#sUi').value=locale;
  $('#sAgent').value=settings.agentResponseLocale||locale;
}

async function saveSettings(){
  const uiLocale=$('#sUi').value;
  const agentResponseLocale=$('#sAgent').value;
  settings=await j('/api/settings',{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uiLocale,agentResponseLocale})
  });
  locale=uiLocale;
  localStorage.setItem('doom-ui-locale',locale);
  await loadMessages();
  await loadData();
  alert(t('settings.saved'));
}

boot().catch(e=>{$('#view').innerHTML='<pre>'+esc(e.stack||e.message)+'</pre>'});
</script>
</body>
</html>
